# Comprueba el plugin contra varias versiones de Moodle y PHP con
# moodle-plugin-ci (https://github.com/moodlehq/moodle-plugin-ci).
# Se ejecuta en cada push y pull request.
name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  js:
    name: Pruebas JavaScript (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run check-strings
      - run: npm run build
      - name: amd/build debe estar al día
        run: git diff --exit-code -- amd/build

  moodle:
    name: Moodle ${{ matrix.moodle-branch }} · PHP ${{ matrix.php }} · ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { moodle-branch: MOODLE_402_STABLE, php: '8.0', database: pgsql }
          - { moodle-branch: MOODLE_402_STABLE, php: '8.1', database: mariadb }
          - { moodle-branch: MOODLE_405_STABLE, php: '8.1', database: pgsql }
          - { moodle-branch: MOODLE_405_STABLE, php: '8.3', database: mariadb }
          - { moodle-branch: MOODLE_500_STABLE, php: '8.2', database: pgsql }
          - { moodle-branch: MOODLE_501_STABLE, php: '8.3', database: mariadb }
          - { moodle-branch: MOODLE_502_STABLE, php: '8.3', database: pgsql }
          - { moodle-branch: MOODLE_503_STABLE, php: '8.4', database: pgsql }
          - { moodle-branch: main, php: '8.4', database: pgsql }

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: root
          MYSQL_ALLOW_EMPTY_PASSWORD: 'true'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    steps:
      - name: Descargar el plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Preparar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1, opcache.jit=disable
          coverage: none

      - name: Instalar moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Instalar Moodle ${{ matrix.moodle-branch }}
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc

      - name: Validación del plugin
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Savepoints de actualización
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Plantillas Mustache
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      # amd/build se genera con scripts/build-amd.mjs (job "js"), no con el Grunt
      # de cada rama de Moodle, cuyo resultado no es byte a byte idéntico.
      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Marcar como fallidos los trabajos cancelados
        if: ${{ cancelled() }}
        run: exit 1
